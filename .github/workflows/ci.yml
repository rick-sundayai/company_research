name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - run: npm ci

      # Only the services the tests use: Postgres, Auth, the REST API and the mail catcher.
      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - run: npm run typecheck

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - run: npm run test:e2e:demo

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
